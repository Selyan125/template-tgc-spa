name: Setup repo

on:
  workflow_dispatch:

jobs:
  issues:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Create issues
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branch = context.payload.pull_request.head.ref;
            const match = branch.match(/^(\d+)-/);
            if (!match) return;

            const issueNumber = parseInt(match[1], 10);

            let issue;
            try {
              issue = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber
              });
            } catch (e) {
              if (e.status === 404) {
                core.warning(`No issue #${issueNumber} found in ${context.repo.owner}/${context.repo.repo}. Skipping PR body update.`);
                return;
              }
              throw e;
            }

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              body: `> Contenu de l'issue [#${issueNumber} — ${issue.data.title}](${issue.data.html_url})\n\n${issue.data.body ?? ''}\n\n---\n\nCloses #${issueNumber}`
            });
